# Lokal "prod-ga o'xshash" muhit:  docker compose -f infra/docker-compose.yml up --build
name: lexlab
x-api-env: &api-env
  ENVIRONMENT: staging
  DATABASE_URL: postgresql+asyncpg://lexlab:lexlab@postgres:5432/lexlab
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: lexlab
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lexlab}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lexlab-secret}
  SCHEDULER_MODE: worker
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars)}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?set MASTER_ENCRYPTION_KEY (base64 32 bytes)}
  LOG_JSON: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: lexlab, POSTGRES_PASSWORD: lexlab, POSTGRES_DB: lexlab}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lexlab"], interval: 5s, retries: 10}

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexlab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lexlab-secret}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-lexlab} $${MINIO_ROOT_PASSWORD:-lexlab-secret}; do sleep 1; done;
             mc mb --ignore-existing local/lexlab"

  migrate:
    build: {context: .., dockerfile: services/api/Dockerfile}
    environment: *api-env
    command: sh -c "alembic upgrade head && python -m app.seed"
    depends_on: {postgres: {condition: service_healthy}}

  api:
    build: {context: .., dockerfile: services/api/Dockerfile}
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker:
    build: {context: .., dockerfile: services/api/Dockerfile}
    environment: *api-env
    command: python -m app.workers.main
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata: {}
  miniodata: {}
