name: api
on:
  push: {paths: ["services/api/**", "packages/legal-content/**", ".github/workflows/api.yml"]}
  pull_request: {paths: ["services/api/**", "packages/legal-content/**"]}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: lexlab, POSTGRES_PASSWORD: lexlab, POSTGRES_DB: lexlab}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lexlab" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - run: mypy app
      - run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL
        env: {DATABASE_URL: "postgresql+asyncpg://lexlab:lexlab@localhost:5432/lexlab", ENVIRONMENT: test}
        run: alembic upgrade head && alembic check && python -m app.seed
